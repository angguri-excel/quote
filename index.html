<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>견적서 계산기</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="toolbar no-print">
  <a class="btn" href="items.html" target="_blank" rel="noopener" title="새 창에서 열려요. 작성 중인 견적서는 그대로 있어요">품목 관리</a>
  <button id="load-csv" title="items.csv를 골라 품목 목록을 바꿔요">품목 CSV 불러오기</button>
  <input id="csv-file" type="file" accept=".csv,text/csv" hidden>
  <button id="add-row">+ 줄 추가</button>
  <button id="reset" title="작성 중인 내용을 지우고 새로 시작해요">새 견적서</button>
  <button id="print" class="primary">인쇄 / PDF 저장</button>
</div>

<main class="sheet">
  <h1>견 적 서</h1>

  <section class="info">
    <table class="meta">
      <tr><th>견적번호</th><td><input id="quote-no" value="Q-2026-0001"></td></tr>
      <tr><th>견적일자</th><td><input id="quote-date" type="date"></td></tr>
      <tr><th>수신</th><td><input id="customer" value="(주)새봄학원 귀하"></td></tr>
      <tr><th>유효기간</th><td><input id="valid" value="견적일로부터 14일"></td></tr>
    </table>
    <table class="meta supplier">
      <tr><th>상호</th><td>(주)한결사무용품</td></tr>
      <tr><th>대표자</th><td>홍길동</td></tr>
      <tr><th>사업자번호</th><td>000-00-00000</td></tr>
      <tr><th>연락처</th><td>02-0000-0000</td></tr>
    </table>
  </section>

  <p class="hangul-line">일금 <strong id="hangul">영</strong> 원정 <span>(₩<span id="hangul-num">0</span>, 부가세 포함)</span></p>

  <table class="items">
    <thead>
      <tr><th class="c-no">No</th><th>품목</th><th class="c-unit">단위</th><th class="c-qty">수량</th><th class="c-price">단가</th><th class="c-amt">금액</th><th class="c-del no-print"></th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <table class="totals">
    <tr><th>공급가액</th><td id="supply">0</td></tr>
    <tr><th>부가세 (10%)</th><td id="vat">0</td></tr>
    <tr class="grand"><th>합계</th><td id="total">0</td></tr>
  </table>

  <p class="note">※ 부가세는 공급가액의 10%를 원 단위로 반올림한 금액입니다.<br>※ 위 금액은 견적용이며 재고·시세에 따라 변동될 수 있습니다.</p>
</main>

<!-- 기본 품목표(JSON). items.csv를 읽지 못할 때만 쓰는 예비용. 품목 수정은 품목 관리(items.html)에서. -->
<script type="application/json" id="items-data">
[
  {"name": "A4 복사용지 (500매)", "unit": "박스", "price": 24500},
  {"name": "볼펜 (검정, 12자루)", "unit": "다스", "price": 4800},
  {"name": "형광펜 (5색 세트)", "unit": "세트", "price": 3900},
  {"name": "스테이플러 (중형)", "unit": "개", "price": 5200},
  {"name": "스테이플러 침 (10호, 20통)", "unit": "박스", "price": 3600},
  {"name": "포스트잇 (76×76, 12패드)", "unit": "팩", "price": 7800},
  {"name": "클리어파일 (A4, 40매)", "unit": "권", "price": 4300},
  {"name": "파일철 (3공 바인더)", "unit": "개", "price": 2900},
  {"name": "화이트보드 마커 (흑/청/적)", "unit": "세트", "price": 3300},
  {"name": "사무용 가위 (대)", "unit": "개", "price": 2400},
  {"name": "탁상용 계산기 (12자리)", "unit": "개", "price": 9800},
  {"name": "라벨지 (A4, 24칸 100매)", "unit": "팩", "price": 11200}
]
</script>
<script src="csv.js"></script>
<script src="app.js"></script>
</body>
</html>
